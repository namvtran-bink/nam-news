<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nam's Morning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Be+Vietnam+Pro:wght@400;500&display=swap">
<style>
/* Layout: a single quiet reading column (~38rem). No boxes or pills: hierarchy comes from type, space, and a few hairlines. Light mode only, by request. */
:root {
  --paper: #F6F7F5;     /* cool off-white, a hint of sage */
  --ink: #1D2321;       /* headlines */
  --text: #3E4744;      /* summaries */
  --quiet: #7D8783;     /* meta, labels */
  --hair: #E1E5E2;      /* dividers */
  --accent: #3F6B5E;    /* links, saved state */
  --up: #3F7A4F;
  --down: #A0493A;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

.page { max-width: 38rem; margin: 0 auto; padding-inline: 20px; padding-block: 20px 96px; }

/* Top line */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.mark { font-family: var(--serif); font-size: 17px; color: var(--ink); letter-spacing: .01em; }
.nav { display: flex; gap: 4px; }
.nav button { min-width: 44px; min-height: 44px; font-size: 14px; color: var(--quiet); padding-inline: 8px; }
.nav button:not(:disabled):hover { color: var(--ink); }
.nav button:disabled { opacity: .35; cursor: default; }

/* Masthead */
.mast { padding-block: 40px 28px; }
.kicker { font-size: 13px; color: var(--quiet); letter-spacing: .02em; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(36px, 9vw, 48px); line-height: 1.08; letter-spacing: -.01em; color: var(--ink); margin: 6px 0 12px; text-wrap: balance; }
.meta { font-size: 14px; color: var(--quiet); }
.meta a { color: var(--accent); text-decoration: none; }

/* Topic */
.topic { padding-top: 44px; }
.label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--hair); }
.label h2 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.label span { font-size: 12px; color: var(--quiet); }
.empty { color: var(--quiet); font-size: 15px; padding-top: 16px; margin: 0; font-style: italic; font-family: var(--serif); }

/* Gold prices: a quiet three-column readout */
.prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-block: 20px 4px; }
.price { min-width: 0; }
.price .k { font-size: 12px; color: var(--quiet); }
.price .v { font-family: var(--serif); font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums lining-nums; line-height: 1.25; white-space: nowrap; }
.price .d { font-size: 12px; font-variant-numeric: tabular-nums; }
.d.up { color: var(--up); } .d.down { color: var(--down); } .d.flat { color: var(--quiet); }
.price .u { font-size: 11px; color: var(--quiet); }
.asof { font-size: 12px; color: var(--quiet); margin: 8px 0 0; }
@media (max-width: 480px) {
  .prices { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 18px; }
  .price.world { grid-column: 1 / -1; }
}

/* Story */
.story { padding-block: 22px; border-bottom: 1px solid var(--hair); }
.story:last-child { border-bottom: 0; }
.src { font-size: 13px; color: var(--quiet); display: flex; flex-wrap: wrap; gap: 0 10px; }
.src .lang { letter-spacing: .08em; font-size: 11px; line-height: 20px; }
h3 { font-family: var(--serif); font-weight: 500; font-size: 21px; line-height: 1.3; color: var(--ink); margin: 6px 0 8px; text-wrap: balance; }
h3 a { text-decoration: none; }
h3 a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.sum { margin: 0; font-size: 15.5px; max-width: 62ch; }
.acts { display: flex; gap: 20px; margin-top: 6px; }
.acts a, .acts button { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; color: var(--quiet); text-decoration: none; }
.acts a:hover, .acts button:hover { color: var(--ink); }
.acts button[aria-pressed="true"] { color: var(--accent); }

/* Later + earlier */
.later ul, .days ul { list-style: none; margin: 0; padding: 0; }
.later li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 12px; border-bottom: 1px solid var(--hair); }
.later li:last-child { border-bottom: 0; }
.later li a { min-width: 0; text-decoration: none; color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.35; }
.later li small { display: block; font-family: var(--sans); font-size: 12px; color: var(--quiet); margin-top: 2px; }
.later li button { min-height: 44px; font-size: 13px; color: var(--quiet); flex-shrink: 0; }
.later .note { color: var(--quiet); font-size: 14px; margin: 14px 0 0; }
.days ul { display: flex; flex-wrap: wrap; gap: 0 18px; padding-top: 8px; }
.days button { min-height: 44px; font-size: 14px; color: var(--quiet); font-variant-numeric: tabular-nums; }
.days button[aria-current="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

.end { text-align: center; font-family: var(--serif); font-style: italic; color: var(--quiet); font-size: 17px; padding-top: 64px; margin: 0; }
.status { color: var(--quiet); padding-top: 32px; }

/* Hero: one bright landscape a day, picked from Wikimedia Commons featured landscapes */
.hero { margin: 16px 0 0; }
.hero .frame { position: relative; aspect-ratio: 3 / 2; max-width: 100%; border-radius: 6px; overflow: hidden;
  background: linear-gradient(180deg, #CFE3EC 0%, #E4EEE6 60%, #EEF0E6 100%); }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
.hero img.ready { opacity: 1; }
@media (prefers-reduced-motion: no-preference) { .hero img { transition: opacity .6s ease; } }
.hero figcaption { font-size: 11px; color: var(--quiet); margin-top: 6px; line-height: 1.4; }
.hero figcaption a { color: inherit; }
.mast { padding-block: 28px 20px; }
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <span class="mark">Nam's Morning</span>
    <nav class="nav" aria-label="Days">
      <button type="button" id="prev" aria-label="Older day" disabled>‹ Older</button>
      <button type="button" id="next" aria-label="Newer day" disabled>Newer ›</button>
    </nav>
  </div>

  <figure class="hero" id="hero">
    <div class="frame"><img id="hero-img" alt=""></div>
    <figcaption id="hero-cap" hidden></figcaption>
  </figure>

  <header class="mast">
    <div class="kicker" id="kicker">Today</div>
    <h1 id="title">Your morning page</h1>
    <div class="meta"><span id="count"></span> · <a href="#later">Later <span id="later-count">0</span></a></div>
  </header>

  <div id="day"><p class="status" id="status">Loading your news…</p></div>

  <section class="topic later" id="later" aria-labelledby="h-later">
    <div class="label"><h2 id="h-later">Later</h2><span>Kept until done</span></div>
    <ul id="later-list"></ul>
    <p class="note" id="later-empty">Tap Save on a story or podcast to keep it here.</p>
  </section>

  <section class="topic days" aria-labelledby="h-days">
    <div class="label"><h2 id="h-days">Earlier days</h2><span id="days-count"></span></div>
    <ul id="days"></ul>
  </section>

  <p class="end" id="end">That's today.</p>
</main>

<script>
// Data: config/topics.json, data/index.json, data/days/<date>.json, published next to this page.
// The later list is kept in this browser.
(function () {
  var topics = [], dates = [], cache = {}, current = null, saved = {};
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function getJSON(p) { return fetch(p, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(p); return r.json(); }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }
  function fmt(iso, opts) {
    var p = (iso || "").split("-").map(Number); if (p.length !== 3) return iso || "";
    opts.timeZone = "UTC"; return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString("en-GB", opts);
  }
  function vn(n) { return Number(n).toLocaleString("vi-VN", { maximumFractionDigits: 2 }); }

  var KEY = "nam-news-later";
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { saved = {}; }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

  function story(it) {
    var a = el("article", "story");
    var src = el("div", "src");
    src.appendChild(el("span", null, it.source || ""));
    if (it.published) src.appendChild(el("span", null, fmt(it.published, { day: "numeric", month: "short" })));
    if (it.duration) src.appendChild(el("span", null, it.duration));
    if (it.lang) src.appendChild(el("span", "lang", String(it.lang).toUpperCase()));
    a.appendChild(src);
    var h = el("h3"), l = el("a", null, it.title || "Untitled");
    l.href = safeUrl(it.url); l.target = "_blank"; l.rel = "noopener"; h.appendChild(l); a.appendChild(h);
    if (it.summary) a.appendChild(el("p", "sum", it.summary));
    var acts = el("div", "acts");
    var open = el("a", null, (it.kind === "Listen" ? "Listen" : it.lang === "vi" ? "Đọc bài gốc" : "Read") + " ↗");
    open.href = safeUrl(it.url); open.target = "_blank"; open.rel = "noopener";
    var b = el("button", "save", "Save"); b.type = "button"; b.dataset.id = it.id;
    b.addEventListener("click", function () {
      if (saved[it.id]) delete saved[it.id];
      else saved[it.id] = { title: it.title, url: it.url, kind: it.kind, source: it.source, savedAt: new Date().toISOString() };
      persist(); renderLater();
    });
    acts.appendChild(open); acts.appendChild(b); a.appendChild(acts);
    return a;
  }

  function prices(g) {
    var wrap = el("div"), grid = el("div", "prices"), rows = g.rows || [];
    rows.forEach(function (r, i) {
      var c = el("div", "price" + (i === rows.length - 1 && rows.length % 2 ? " world" : ""));
      c.appendChild(el("div", "k", r.label));
      var dir, ch;
      if (r.currency === "VND") {
        c.appendChild(el("div", "v", vn(r.buy) + " – " + vn(r.sell)));
        c.appendChild(el("div", "u", "triệu đ/lượng · mua – bán"));
        dir = r.change; ch = r.change != null ? vn(Math.abs(r.change)) + " triệu" : null;
      } else {
        c.appendChild(el("div", "v", "$" + Math.round(r.price).toLocaleString("en-US")));
        c.appendChild(el("div", "u", "per troy ounce"));
        dir = r.change_pct; ch = r.change_pct != null ? Math.abs(r.change_pct) + "%" : null;
      }
      if (ch) c.appendChild(el("div", "d " + (dir > 0 ? "up" : dir < 0 ? "down" : "flat"), (dir > 0 ? "▲ " : dir < 0 ? "▼ " : "") + ch));
      grid.appendChild(c);
    });
    wrap.appendChild(grid);
    if (g.as_of) wrap.appendChild(el("p", "asof", g.as_of));
    return wrap;
  }

  function renderDay() {
    var host = $("day"); host.textContent = "";
    var d = cache[current];
    if (!d) { host.appendChild(el("p", "status", dates.length ? "Loading…" : "No days yet.")); return; }
    var n = 0, pods = 0, items = d.items || [], notes = d.notes || {};
    topics.forEach(function (t) {
      var mine = items.filter(function (it) { return it.topic === t.key; });
      var sec = el("section", "topic"), lab = el("div", "label");
      lab.appendChild(el("h2", null, t.name)); lab.appendChild(el("span", null, t.rhythm || ""));
      sec.appendChild(lab);
      if (t.key === "gold" && d.gold_prices) sec.appendChild(prices(d.gold_prices));
      mine.forEach(function (it) { it.kind === "Listen" ? pods++ : n++; sec.appendChild(story(it)); });
      if (!mine.length) sec.appendChild(el("p", "empty", notes[t.key] || "Nothing worth your time today."));
      host.appendChild(sec);
    });
    var idx = dates.indexOf(current);
    $("kicker").textContent = idx === 0 ? "Today" : "Earlier";
    $("title").textContent = fmt(d.date, { weekday: "long", day: "numeric", month: "long" });
    $("count").textContent = n + (n === 1 ? " story" : " stories") + (pods ? ", " + pods + (pods === 1 ? " podcast" : " podcasts") : "") + " · about " + Math.max(1, Math.ceil(n * 1.2)) + " min";
    $("prev").disabled = idx >= dates.length - 1;
    $("next").disabled = idx <= 0;
    $("end").textContent = idx === 0 ? "That's today." : "That's " + fmt(d.date, { weekday: "long", day: "numeric", month: "short" }) + ".";
    renderLater();
  }

  function renderDays() {
    var ul = $("days"); ul.textContent = "";
    dates.forEach(function (date) {
      var li = el("li"), b = el("button", null, fmt(date, { weekday: "short", day: "numeric", month: "short" }));
      b.type = "button"; b.setAttribute("aria-current", date === current ? "true" : "false");
      b.addEventListener("click", function () { show(date); window.scrollTo(0, 0); });
      li.appendChild(b); ul.appendChild(li);
    });
    $("days-count").textContent = dates.length + (dates.length === 1 ? " day" : " days");
  }

  function renderLater() {
    var ul = $("later-list"); ul.textContent = "";
    var keys = Object.keys(saved).sort(function (a, b) { return String(saved[b].savedAt).localeCompare(String(saved[a].savedAt)); });
    keys.forEach(function (id) {
      var s = saved[id], li = el("li"), a = el("a", null, s.title || "Untitled");
      a.href = safeUrl(s.url); a.target = "_blank"; a.rel = "noopener";
      a.appendChild(el("small", null, (s.kind === "Listen" ? "Listen" : "Read") + " · " + (s.source || "")));
      var b = el("button", null, "Done"); b.type = "button"; b.setAttribute("aria-label", "Done with " + (s.title || ""));
      b.addEventListener("click", function () { delete saved[id]; persist(); renderLater(); });
      li.appendChild(a); li.appendChild(b); ul.appendChild(li);
    });
    $("later-empty").hidden = keys.length > 0;
    $("later-count").textContent = keys.length;
    document.querySelectorAll(".save").forEach(function (b) {
      var on = !!saved[b.dataset.id];
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.textContent = on ? "Saved" : "Save";
    });
  }

  function show(date) {
    current = date; renderDays(); renderDay();
    if (cache[date]) return;
    getJSON("data/days/" + date + ".json").then(function (d) { cache[date] = d; if (current === date) renderDay(); })
      .catch(function () { if (current === date) { $("day").textContent = ""; $("day").appendChild(el("p", "status", "Couldn't load this day. Reload to try again.")); } });
  }
  function step(k) { var j = dates.indexOf(current) + k; if (j >= 0 && j < dates.length) { show(dates[j]); window.scrollTo(0, 0); } }
  $("prev").addEventListener("click", function () { step(1); });
  $("next").addEventListener("click", function () { step(-1); });

  renderLater();
  Promise.all([getJSON("config/topics.json"), getJSON("data/index.json")]).then(function (r) {
    topics = r[0].topics || [];
    dates = (r[1].days || []).slice().sort().reverse();
    if (dates.length) show(dates[0]); else renderDay();
  }).catch(function () { $("status").textContent = "Couldn't load your news. Reload to try again."; });
  // Hero photo: a featured landscape from Wikimedia Commons, the same one all day.
  (function hero() {
    var API = "https://commons.wikimedia.org/w/api.php?format=json&origin=*&";
    var CATS = ["Category:Featured_pictures_of_landscapes", "Category:Quality_images_of_landscapes"];
    var DARK = /night|nocturn|dusk|twilight|evening|sunset|aurora|milky|star|moon|storm|fog|mist|dark|black|silhouette|winter/i;
    var today = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Ho_Chi_Minh" });
    var KEY = "nam-news-hero";
    function seed(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
    function strip(html) { var d = document.createElement("div"); d.innerHTML = html || ""; return (d.textContent || "").trim(); }
    function paint(h) {
      var img = $("hero-img");
      img.onload = function () { img.classList.add("ready"); };
      img.alt = h.alt || "Landscape photo";
      img.src = h.src;
      var cap = $("hero-cap"); cap.textContent = "";
      cap.appendChild(document.createTextNode("Photo: " + (h.artist || "Unknown") + (h.license ? " · " + h.license : "") + " · "));
      var a = el("a", null, "Wikimedia Commons"); a.href = safeUrl(h.page); a.target = "_blank"; a.rel = "noopener";
      cap.appendChild(a); cap.hidden = false;
    }
    try { var c = JSON.parse(localStorage.getItem(KEY) || "null"); if (c && c.date === today && c.src) { paint(c); return; } } catch (e) {}
    function pick(ci) {
      if (ci >= CATS.length) return;
      fetch(API + "action=query&list=categorymembers&cmtype=file&cmlimit=500&cmtitle=" + encodeURIComponent(CATS[ci]))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var files = ((j.query || {}).categorymembers || []).map(function (m) { return m.title; }).filter(function (t) { return !DARK.test(t); });
          if (!files.length) return pick(ci + 1);
          var title = files[seed(today) % files.length];
          return fetch(API + "action=query&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1600&titles=" + encodeURIComponent(title))
            .then(function (r) { return r.json(); })
            .then(function (j2) {
              var pages = (j2.query || {}).pages || {}, p = pages[Object.keys(pages)[0]] || {}, ii = (p.imageinfo || [])[0];
              if (!ii || !ii.thumburl) return pick(ci + 1);
              var md = ii.extmetadata || {};
              var h = { date: today, src: ii.thumburl, page: ii.descriptionurl,
                artist: strip((md.Artist || {}).value), license: strip((md.LicenseShortName || {}).value),
                alt: strip((md.ImageDescription || {}).value).slice(0, 160) };
              try { localStorage.setItem(KEY, JSON.stringify(h)); } catch (e) {}
              paint(h);
            });
        })
        .catch(function () { pick(ci + 1); });
    }
    pick(0);
  })();
})();
</script>

</body>
</html>
