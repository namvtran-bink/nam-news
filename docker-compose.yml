# docker compose up -d                          daily scheduler (05:30 Asia/Saigon)
# docker compose run --rm quiet add "<topic>"   follow a topic (runs it once now)
# docker compose run --rm quiet topics          list followed topics
# docker compose run --rm quiet update          fetch + publish right now
services:
  quiet:
    build: .
    image: quiet:latest
    env_file: docker/.env
    volumes:
      - ./data:/data        # database + site/index.html, visible on your Mac in ./data
    restart: unless-stopped
